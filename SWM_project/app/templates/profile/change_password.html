{% extends "base.html" %}
{% block title %}Change Password — EcoLoop{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="eco-auth-card">
        <div class="d-flex align-items-center mb-4">
          <a href="{{ url_for('profile.view') }}" class="btn btn-outline-light text-dark btn-sm me-3 border">
            <i class="bi bi-arrow-left"></i>
          </a>
          <h2 class="h4 fw-bold mb-0">Change Password</h2>
        </div>

        <form method="POST" action="{{ url_for('profile.change_password') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label fw-semibold">Current Password</label>
            <input type="password" name="current_password" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">New Password</label>
            <input type="password" name="new_password" class="form-control" minlength="8" required>
            <div class="form-text small">Must be at least 8 characters.</div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Confirm New Password</label>
            <input type="password" name="confirm_password" class="form-control" minlength="8" required>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('profile.view') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-eco-primary">Update Password</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
