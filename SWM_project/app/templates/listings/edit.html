{% extends "base.html" %}
{% block title %}Edit Listing — EcoLoop{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="d-flex align-items-center gap-3 mb-4">
        <a href="{{ url_for('listings.detail', listing_id=listing.id) }}" class="btn btn-eco-outline btn-sm">
          <i class="bi bi-arrow-left me-1"></i>Back
        </a>
        <h1 class="h3 fw-700 mb-0">Edit Listing</h1>
      </div>

      <div class="eco-card">
        <div class="eco-card-body">
          <form method="POST" action="{{ url_for('listings.edit', listing_id=listing.id) }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
              <label for="title" class="form-label fw-500">Item Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control eco-input" id="title" name="title"
                     value="{{ listing.title }}" required maxlength="200">
            </div>

            <div class="mb-3">
              <label for="brand_model" class="form-label fw-500">Brand / Model</label>
              <input type="text" class="form-control eco-input" id="brand_model" name="brand_model"
                     value="{{ listing.brand_model or '' }}">
            </div>

            <div class="mb-3">
              <label for="defects" class="form-label fw-500">Known Defects</label>
              <textarea class="form-control eco-input" id="defects" name="defects"
                        rows="3">{{ listing.defects or '' }}</textarea>
            </div>

            <div class="mb-3">
              <label for="asking_price" class="form-label fw-500">Asking Price (₹)</label>
              <input type="number" class="form-control eco-input" id="asking_price" name="asking_price"
                     value="{{ listing.asking_price or '' }}" min="0" step="1">
            </div>

            <div class="mb-4">
              <label for="additional_notes" class="form-label fw-500">Additional Notes</label>
              <textarea class="form-control eco-input" id="additional_notes" name="additional_notes"
                        rows="2">{{ listing.additional_notes or '' }}</textarea>
            </div>

            <div class="d-flex gap-3">
              <button type="submit" class="btn btn-eco-primary">
                <i class="bi bi-check-lg me-2"></i>Save Changes
              </button>
              <a href="{{ url_for('listings.detail', listing_id=listing.id) }}"
                 class="btn btn-eco-outline">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
