{% extends "base.html" %}
{% block title %}Server Error (500) — EcoLoop{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="py-5">
    <div class="display-1 fw-800 text-warning mb-2">500</div>
    <h1 class="h3 fw-bold mb-3">Unexpected System Error</h1>
    <p class="text-muted mx-auto mb-4" style="max-width: 480px;">
      An unexpected internal error occurred while processing your recovery request. Our team has logged the issue.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-eco-primary">
        <i class="bi bi-house me-1"></i> Return Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
