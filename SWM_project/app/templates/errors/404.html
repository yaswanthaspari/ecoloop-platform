{% extends "base.html" %}
{% block title %}Page Not Found (404) — EcoLoop{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="py-5">
    <div class="display-1 fw-800 text-success mb-2">404</div>
    <h1 class="h3 fw-bold mb-3">Page Not Found</h1>
    <p class="text-muted mx-auto mb-4" style="max-width: 480px;">
      The electronic resource you are looking for may have been moved, recovered, or no longer exists.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-eco-primary">
        <i class="bi bi-house me-1"></i> Return Home
      </a>
      <a href="{{ url_for('marketplace.index') }}" class="btn btn-outline-secondary">
        <i class="bi bi-shop me-1"></i> Browse Marketplace
      </a>
    </div>
  </div>
</div>
{% endblock %}
